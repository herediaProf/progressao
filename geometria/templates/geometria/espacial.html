{% extends "base.html" %} {% block title %}Geometria Espacial 3D Interativa{%
endblock %} {% block content %}
<h2>2. Laboratório de Geometria Espacial 3D (Sólidos & Volumes)</h2>

<div
  style="
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
    margin-top: 20px;
  "
>
  <div style="background: var(--bg-card); padding: 20px; border-radius: 8px">
    <h3>Controles do Sólido</h3>
    <br />
    <label>Sólido Geométrico:</label>
    <select
      id="tipoSolido"
      style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px"
      onchange="atualizarSolido()"
    >
      <option value="cubo">Cubo / Paralelepípedo</option>
      <option value="esfera">Esfera</option>
      <option value="cilindro">Cilindro</option>
      <option value="cone">Cone</option>
    </select>

    <label>Escala/Raio: <span id="valRaio">2</span></label>
    <input
      type="range"
      id="raio"
      min="1"
      max="4"
      step="0.5"
      value="2"
      style="width: 100%"
      oninput="atualizarSolido()"
    />

    <div
      id="infoVolume"
      style="
        margin-top: 20px;
        background: #0f172a;
        padding: 12px;
        border-radius: 6px;
        border-left: 4px solid var(--accent-blue);
      "
    >
      Volume: <strong>8 u.v.</strong>
    </div>
  </div>

  <div style="background: var(--bg-card); padding: 20px; border-radius: 8px">
    <div
      id="container3d"
      style="width: 100%; height: 450px; border-radius: 6px; overflow: hidden"
    ></div>
  </div>
</div>
{% endblock %} {% block extra_js %}
<script>
  let scene, camera, renderer, mesh;

  function init3D() {
    const container = document.getElementById("container3d");
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    camera = new THREE.PerspectiveCamera(
      45,
      container.clientWidth / container.clientHeight,
      0.1,
      1000,
    );
    camera.position.set(5, 5, 7);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    const gridHelper = new THREE.GridHelper(10, 10, 0x3b82f6, 0x334155);
    scene.add(gridHelper);

    atualizarSolido();
    animate();
  }

  function atualizarSolido() {
    if (mesh) scene.remove(mesh);

    const tipo = document.getElementById("tipoSolido").value;
    const r = parseFloat(document.getElementById("raio").value);
    document.getElementById("valRaio").innerText = r;

    let geometry;
    let vol = 0;

    if (tipo === "cubo") {
      geometry = new THREE.BoxGeometry(r, r, r);
      vol = Math.pow(r, 3);
    } else if (tipo === "esfera") {
      geometry = new THREE.SphereGeometry(r, 32, 32);
      vol = (4 / 3) * Math.PI * Math.pow(r, 3);
    } else if (tipo === "cilindro") {
      geometry = new THREE.CylinderGeometry(r, r, r * 2, 32);
      vol = Math.PI * Math.pow(r, 2) * (r * 2);
    } else if (tipo === "cone") {
      geometry = new THREE.ConeGeometry(r, r * 2, 32);
      vol = (1 / 3) * Math.PI * Math.pow(r, 2) * (r * 2);
    }

    const material = new THREE.MeshPhongMaterial({
      color: 0x3b82f6,
      wireframe: false,
      transparent: true,
      opacity: 0.85,
    });
    mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    document.getElementById("infoVolume").innerHTML =
      `Volume Estimado: <strong>${vol.toFixed(2)} u.v.</strong>`;
  }

  function animate() {
    requestAnimationFrame(animate);
    if (mesh) mesh.rotation.y += 0.01;
    renderer.render(scene, camera);
  }

  window.onload = init3D;
</script>
{% endblock %}
